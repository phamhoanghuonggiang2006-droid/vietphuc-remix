<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8C6D23" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Họa tiết mây ngọc cung đình cổ phong Triều Nguyễn (Ngũ sắc tường vân) -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    
    <!-- Cụm mây trung tâm (Royal Cloud Cluster 1) -->
    <path d="M 80 80 
             Q 100 50, 130 65 
             Q 160 45, 190 70 
             Q 220 55, 235 85 
             Q 250 115, 225 135 
             Q 235 155, 215 170 
             Q 185 185, 155 170 
             Q 125 185, 95 165 
             Q 70 145, 80 120 
             Q 65 95, 80 80 Z" />
    <path d="M 105 85 Q 120 70, 145 75 Q 170 65, 185 85 Q 205 75, 215 95" stroke-dasharray="2 4" />
    <path d="M 115 115 Q 140 100, 165 110 Q 185 105, 195 125" opacity="0.6" />
    <circle cx="155" cy="115" r="3" fill="#D4AF37" opacity="0.7" />

    <!-- Dải vân mây trôi (Whimsical Flowing Streamers) -->
    <path d="M 60 115 Q 35 125, 20 115 Q 5 105, 2 120" />
    <path d="M 235 95 Q 265 85, 285 95 Q 305 105, 318 90" />
    <path d="M 180 185 Q 195 210, 225 215 Q 255 220, 270 205" />

    <!-- Cụm mây góc dưới trái (Royal Cloud Cluster 2) -->
    <path d="M 10 240 
             Q 30 220, 55 230 
             Q 75 215, 100 235 
             Q 120 225, 130 245 
             Q 140 265, 120 280 
             Q 105 295, 80 285 
             Q 55 295, 35 280 
             Q 15 285, 5 270 
             Q -5 255, 10 240 Z" />
    <path d="M 30 245 Q 50 235, 70 245 Q 85 240, 95 255" opacity="0.6" />

    <!-- Cụm mây góc trên phải (Royal Cloud Cluster 3) -->
    <path d="M 250 20 
             Q 270 5, 290 15 
             Q 310 5, 325 25 
             Q 335 45, 315 60 
             Q 295 70, 275 60 
             Q 255 65, 245 50 
             Q 235 35, 250 20 Z" />

    <!-- Họa tiết đốm sao tinh tú & hạt vàng kim nhũ lụa tơ tằm -->
    <circle cx="45" cy="45" r="1.5" fill="#D4AF37" />
    <circle cx="280" cy="160" r="1.5" fill="#D4AF37" />
    <circle cx="160" cy="270" r="1.5" fill="#D4AF37" />
    <circle cx="270" cy="290" r="1" fill="#D4AF37" />
    <circle cx="40" cy="170" r="1" fill="#D4AF37" />
    <circle cx="180" cy="25" r="1.2" fill="#D4AF37" />

    <!-- Sớ dệt gấm lụa mờ (Silk Weave Subtle Lines) -->
    <line x1="0" y1="160" x2="320" y2="160" stroke="#D4AF37" stroke-width="0.3" stroke-dasharray="4 16" opacity="0.3" />
    <line x1="160" y1="0" x2="160" y2="320" stroke="#D4AF37" stroke-width="0.3" stroke-dasharray="4 16" opacity="0.3" />
  </g>
</svg>
